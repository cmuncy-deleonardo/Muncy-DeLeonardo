<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Iconic Horror Movies & Fun Facts About Them</title>
    <link href="exercise-10.css" rel="stylesheet" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="header">
      <h1>Iconic Horror Movies of the 20th Century</h1>
      <p>Click to reveal an interesting fact!</p>
    </header>
    <div class="content-wrapper">
      <main class="main-content">
        <button type="button">
          <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiwWmD3wu8aoUqxEvzCa42_EDYF8oSjIUvrHRQ7ZhrMjXhbv47RRjIx-Q_eDZl2V0G1_RbQ7pg8ggBd7DQFp6bPOpJomRyVIUGKWuWZeXwtn39z2mBAPV8CBhB_iFAD-wUjlgKGEwYz97oE/s400/night-of-the-living-dead-zombie-girl1.jpg" alt="A young girl with a serious looking expression">
          <span class="fact-text">Night of the Living Dead (1968) fell into the public domain because the distributor forgot to include a copyright notice on the prints after changing the name from Night of the Flesh Eaters.</span>
        </button>
        <button type="button">
          <img src="https://pdr-assets.b-cdn.net/collections/the-cabinet-of-dr-caligari-1920/drcalgari.jpeg?width=640&height=1200" alt="A man with heavy makeup and an eerie intense expression">
          <span class="fact-text">The Cabinet of Dr. Caligari (1920) was so well loved it played at a theatre in Paris for 7 years straight!</span>
        </button>
        <button type="button">
          <img src="https://pdr-assets.b-cdn.net/collections/the-phantom-of-the-opera-1925/477px-ChaneyPhantomoftheOpera.jpg?width=640&height=1200" alt="Lon Chaney as the Phantom of the opera, with terrifying skull-like face">
          <span class="fact-text">The Phantom's iconic bed, in Phantom of the Opera (1925) was reused as Gloria Swanson's bed in Sunset Boulevard (1950).</span>
        </button>
        <button type="button">
          <img src="https://upload.wikimedia.org/wikipedia/commons/f/f2/Nosferatu_%281922%29_-_Count_Orlok_Standing_In_A_Wooden_Doorway_%28Greyscale%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=original" alt="Still from Nosferatu (1922) showing Count Orlok standing rigidly in a doorway, staring directly forward with an eerie, gaunt expression">
          <span class="fact-text">Bram Stoker's widow sued the production company that made Nosferatu (1922), and all copies were ordered to be destroyed. The film most likely survived through copies that were shipped internationally.</span>
        </button>
        <button type="button">
          <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3d/COS_02.JPG/1280px-COS_02.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail" alt="Black and white still from Carnival of Souls (1962)showing a distraught looking woman emerging out of water wearing a filthy dress">
          <span class="fact-text">After seeing Carnival of Souls (1962), Candace Hilligoss, who played the lead character Mary Henry, was dropped by her agency.</span>
        </button>
        <button type="button">
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/c4/Vincent_Price_in_House_on_Haunted_Hill.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail_unscaled&_=20110416170531" alt="Still of Vincent Price looking intensely over a desk in House on Haunted Hill. (1959)">
          <span class="fact-text">The low-budget House on Haunted Hill (1959) was such a commercial success, that it was said to have inspired Alfred Hitchcock to make his own horror film, Psycho.</span>
        </button>
      </main>
    </div>
  </body>
</html>
